name: Publish reviewed Tag Manager release

on:
  push:
    tags: ['tagManager-v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'rzp-labs/stash-plugins'
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Validate release tag
        shell: bash
        run: |
          version=$(sed -n 's/^version: //p' plugins/tagManager/tagManager.yml)
          test "$GITHUB_REF_NAME" = "tagManager-v$version"
          git merge-base --is-ancestor HEAD origin/main
      - run: bash build_site.sh _site/stable
      # Preserve upstream's stable/develop feed layout.
      - run: cp -r _site/stable _site/develop
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
