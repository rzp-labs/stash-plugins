name: Tag Manager checks

on:
  pull_request:
    paths:
      - 'plugins/tagManager/**'
      - '.github/**'
      - 'build_site.sh'
      - 'LICENSE'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements-tagmanager-tests.txt
      - name: Offline Python tests
        working-directory: plugins/tagManager
        env:
          STASH_PLUGINS_INTEGRATION: '0'
        run: python -m pytest -q
      - name: JavaScript syntax and offline tests
        run: |
          node --check plugins/tagManager/tag-manager.js
          for file in plugins/tagManager/tests/test_*.js; do
            node "$file" || exit 1
          done
      - name: Manifests and reproducible package
        run: |
          python .github/scripts/lint_manifests.py
          bash build_site.sh "$RUNNER_TEMP/package-a"
          bash build_site.sh "$RUNNER_TEMP/package-b"
          cmp "$RUNNER_TEMP/package-a/tagManager.zip" "$RUNNER_TEMP/package-b/tagManager.zip"
          cmp "$RUNNER_TEMP/package-a/index.yml" "$RUNNER_TEMP/package-b/index.yml"
          python .github/scripts/check_tagmanager_package.py "$RUNNER_TEMP/package-a"
